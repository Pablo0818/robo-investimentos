<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Entrar · Robô de Investimentos</title>
<link rel="stylesheet" href="/static/app.css">
<style>body{font-family:Inter,system-ui,sans-serif}input{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:16px;width:100%}</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
  <div class="text-center mb-5"><div class="text-4xl">🤖</div><div class="font-bold text-xl mt-1">Robô de Investimentos</div></div>

  <form id="loginForm" class="space-y-3">
    <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button class="w-full bg-slate-900 text-white font-semibold rounded-xl py-3">Entrar</button>
  </form>

  <form id="changeForm" class="space-y-3 hidden">
    <div class="text-sm bg-amber-50 border border-amber-200 rounded-lg p-3">Primeiro acesso: crie a sua senha. Ela precisa ter pelo menos 10 caracteres.</div>
    <input id="old" type="password" placeholder="Senha atual (a que você recebeu)" autocomplete="current-password" required>
    <input id="new1" type="password" placeholder="Nova senha" autocomplete="new-password" required minlength="10">
    <input id="new2" type="password" placeholder="Repita a nova senha" autocomplete="new-password" required minlength="10">
    <button class="w-full bg-emerald-600 text-white font-semibold rounded-xl py-3">Salvar nova senha</button>
  </form>

  <div id="msg" class="text-sm text-red-600 mt-3 text-center"></div>
</div>
<script>
const $=s=>document.querySelector(s);
async function post(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||"Erro");return j}
function showChange(){$("#loginForm").classList.add("hidden");$("#changeForm").classList.remove("hidden")}
$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#msg").textContent="";
  try{const r=await post("/api/login",{email:$("#email").value,password:$("#pw").value});
    if(r.must_change){$("#old").value=$("#pw").value;showChange()}else location.href="/"}catch(err){$("#msg").textContent=err.message}};
$("#changeForm").onsubmit=async e=>{e.preventDefault();$("#msg").textContent="";
  if($("#new1").value!==$("#new2").value){$("#msg").textContent="As senhas não conferem";return}
  try{await post("/api/password",{old:$("#old").value,new:$("#new1").value});location.href="/"}catch(err){$("#msg").textContent=err.message}};
fetch("/api/me").then(r=>r.ok?r.json():null).then(u=>{if(u&&u.must_change)showChange();else if(u)location.href="/"});
</script>
</body>
</html>

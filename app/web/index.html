<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robô">
<title>Robô de Investimentos</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/chart.umd.js"></script>
<script src="/static/lwc.js"></script>
<style>
  :root{--bg:#0a0f1c;--panel:#111827;--panel2:#162033;--line:#1f2a3d;--muted:#8b97ad;--txt:#e6ebf5;--up:#22c55e;--down:#ef4444;--acc:#38bdf8;--warn:#f59e0b}
  body{background:var(--bg);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .muted{color:var(--muted)} .up{color:var(--up)} .down{color:var(--down)}
  .btn{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s}
  .btn:active{transform:scale(.97)}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .tab{color:var(--muted);padding:8px 14px;border-radius:10px;white-space:nowrap;font-weight:500}
  .tab.active{background:var(--panel2);color:var(--txt)}
  table{width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;font-size:12px}td{padding:8px 6px;border-top:1px solid var(--line)}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font-size:16px;width:100%}
  .num{font-variant-numeric:tabular-nums}
  .kpi-v{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .tick{display:flex;gap:24px;animation:scroll 40s linear infinite;width:max-content}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}} .live-dot{width:8px;height:8px;border-radius:99px;background:var(--up);display:inline-block;animation:pulse 1.6s infinite}
  .glow{box-shadow:0 0 0 1px rgba(56,189,248,.35),0 8px 30px -10px rgba(56,189,248,.35)}
  .seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px}.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}.seg button.on{background:var(--panel);color:var(--txt);box-shadow:0 1px 0 var(--line)}
  ::-webkit-scrollbar{display:none}
</style>
</head>
<body class="min-h-screen pb-10">
<div id="banner"></div>

<header class="px-4 pt-4 pb-3" style="padding-top:max(16px,env(safe-area-inset-top))">
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0" style="background:linear-gradient(135deg,#0ea5e9,#22c55e)">📈</div>
      <div class="min-w-0"><div class="font-bold text-lg leading-tight">Robô de Investimentos</div>
        <div id="sub" class="text-xs muted truncate"></div></div>
    </div>
    <div class="flex gap-2 shrink-0">
      <button class="btn text-slate-900" style="background:var(--warn)" onclick="togglePause()" id="pauseBtn" title="Pausar">⏸</button>
      <button class="btn text-white" style="background:var(--down)" onclick="panic()" title="Travar">🛑</button>
      <button class="btn" style="background:var(--panel2)" onclick="logout()" title="Sair">⎋</button>
    </div>
  </div>
</header>

<div class="overflow-hidden border-y" style="border-color:var(--line);background:#0d1424"><div id="ticker" class="tick py-2 px-4 text-sm num muted">Carregando cotações…</div></div>
<nav class="flex gap-1 overflow-x-auto px-3 py-2 sticky top-0 z-10" id="tabs" style="background:rgba(10,15,28,.92);backdrop-filter:blur(8px)"></nav>
<main class="px-3 max-w-6xl mx-auto space-y-3" id="main"></main>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 text-sm px-4 py-2 rounded-xl hidden z-50" style="background:var(--panel2);border:1px solid var(--line)"></div>

<script>
const TABS=[["home","Painel"],["wallet","Carteira"],["market","Mercado"],["calc","Calculadora"],["signals","Sinais"],["positions","Posições"],["strategies","Estratégias"],["us","Pesquisa EUA"],["finance","Finanças"],["settings","Ajustes"],["logs","Registro"]];
let tab="home",S=null,charts=[],lwc=null,sel=null,wmode="paper";
const $=s=>document.querySelector(s);
const fmt=(v,d=2)=>v==null||isNaN(v)?"-":Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const px=v=>v==null?"-":fmt(v,v<1?6:v<100?4:2);
const pct=v=>v==null||isNaN(v)?"-":(v>0?"+":"")+(v*100).toFixed(2)+"%";
const cls=v=>v>0?"up":v<0?"down":"";
const dt=s=>s?new Date(s).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const ago=s=>{if(!s)return"";const m=Math.round((Date.now()-new Date(s))/60000);return m<1?"agora":m<60?m+" min":m<1440?Math.round(m/60)+" h":Math.round(m/1440)+" d"};
const MK={main:"Cripto (simulação)",us:"EUA",b3:"B3",real:"💰 Real (R$)"};
const STA={pending:"aguardando",executed:"executado",rejected:"recusado",expired:"expirou",failed:"falhou",cancelled:"cancelado"};
async function api(p,opt={}){const r=await fetch(p,{headers:{"Content-Type":"application/json"},...opt});if(r.status==401||r.status==403){location.href="/login";throw new Error("login")}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),4000)}
function killCharts(){charts.forEach(c=>{try{c.destroy?c.destroy():c.remove()}catch(e){}});charts=[];lwc=null}
function renderTabs(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k==tab?"active":""}" onclick="go('${k}')">${l}${k=="signals"&&S&&S.pending?` <span class="chip text-white" style="background:var(--down)">${S.pending}</span>`:""}</button>`).join("")}
function go(k){tab=k;sel=null;render();window.scrollTo(0,0)}

function spark(vals,w=90,h=28){if(!vals||vals.length<2)return"";const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-(v-mn)/r*h).toFixed(1)}`).join(" ");
  const c=vals[vals.length-1]>=vals[0]?"var(--up)":"var(--down)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${c}" stroke-width="1.8" points="${pts}"/></svg>`}

async function load(){S=await api("/api/status");const st=S.settings;
  $("#sub").textContent=`${S.trading_mode=="live"?"● DINHEIRO REAL":"● Simulação"} · ${st.execution_mode=="auto"?"Automático":"Manual"}${S.profile=="metralhadora"?" · ⚡ Metralhadora":S.profile=="turbo"?" · 🚀 Turbo":""} · ${dt(S.last_cycle)}`;
  let b="";
  if(S.trading_mode=="live")b+=`<div class="text-center text-sm py-1 text-white" style="background:var(--down)">⚠️ MODO REAL: as ordens usam seu dinheiro · a simulação continua na Carteira › Fictício</div>`;
  if(st.kill_switch=="true")b+=`<div class="text-center text-sm py-1 text-white" style="background:#7f1d1d">🛑 Trava de segurança ligada: nenhuma compra nova. Destrave em Ajustes.</div>`;
  if(st.paused=="true")b+=`<div class="text-center text-sm py-1 text-slate-900" style="background:var(--warn)">⏸ Robô pausado</div>`;
  $("#banner").innerHTML=b;$("#pauseBtn").textContent=st.paused=="true"?"▶":"⏸";renderTabs();loadTicker()}

async function loadTicker(){try{const w=await api("/api/market/watchlist");if(!w.length)return;
  const it=w.map(r=>`<span><b style="color:var(--txt)">${r.name}</b> ${px(r.price)} <span class="${cls(r.change_24h)}">${pct(r.change_24h)}</span></span>`).join("");
  $("#ticker").innerHTML=it+it}catch(e){}}

async function render(){killCharts();await load();const m=$("#main");m.innerHTML="";
  ({home,wallet,market,calc,signals,positions,strategies,us,finance,settings,logs})[tab](m)}

function kpi(l,v,c="",sub=""){return `<div class="card"><div class="text-xs muted">${l}</div><div class="kpi-v num ${c}">${v}</div>${sub?`<div class="text-xs muted mt-0.5 truncate">${sub}</div>`:""}</div>`}

/* ------------------------------- PAINEL ------------------------------- */
async function home(m){
  const ret=S.deposits?S.profit/S.deposits:0;
  m.innerHTML=`
  <div class="card glow" style="background:linear-gradient(135deg,#0f1b33,#0b1324)">
    <div class="flex justify-between items-start"><div><div class="text-xs muted">${S.sim_equity!=null?"💰 Dinheiro real (R$)":"Patrimônio total"}</div>
      <div class="text-3xl font-bold num mt-1">${fmt(S.equity)}</div>
      <div class="text-sm mt-1 num ${cls(S.profit)}">${S.profit>=0?"▲":"▼"} ${fmt(Math.abs(S.profit))} (${pct(ret)}) no total</div></div>
      <div class="text-right"><div class="text-xs muted">Hoje</div><div class="font-semibold num ${cls(S.day_pnl)}">${fmt(S.day_pnl)}</div></div></div>
    <div class="mt-3" style="height:150px"><canvas id="eq"></canvas></div>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    ${kpi("Lucro realizado",fmt(S.realized_pnl),cls(S.realized_pnl))}${kpi("Queda desde o topo",pct(-S.drawdown),S.drawdown>0.1?"down":"","limite "+(S.settings.max_drawdown_pct*100)+"%")}
    ${kpi("Posições abertas",S.positions.length,"",S.positions.map(p=>p.symbol).join(", ")||"nenhuma")}${kpi("Taxas pagas",fmt(S.fees))}
  </div>
  <div class="grid md:grid-cols-2 gap-3">
    <div class="card"><div class="font-semibold mb-2">Por mercado <span class="text-xs muted font-normal">(cada um na sua moeda)</span></div>
      <div class="flex items-center gap-4"><div style="width:110px;height:110px" class="shrink-0"><canvas id="alloc"></canvas></div>
      <div class="flex-1 space-y-2 min-w-0">${(S.by_market||[]).map((x,i)=>`<div><div class="flex justify-between text-sm"><span><span class="inline-block w-2.5 h-2.5 rounded-full mr-1.5" style="background:${["#38bdf8","#a78bfa","#22c55e"][i%3]}"></span>${x.label}</span><span class="num font-semibold">${fmt(x.equity)}</span></div><div class="text-xs muted text-right num">caixa ${fmt(x.cash)} · investido ${fmt(x.equity-x.cash)}</div></div>`).join("")}</div></div></div>
    <div class="card"><div class="flex justify-between items-center mb-2"><div class="font-semibold">Desempenho</div><div class="text-xs muted" id="st0"></div></div>
      <div class="grid grid-cols-3 gap-2 text-center mb-2" id="st1"></div><div style="height:90px"><canvas id="pnls"></canvas></div></div>
  </div>
  <div class="card"><div class="font-semibold mb-1">🏆 Quem está dando mais lucro</div><div class="text-xs muted mb-2">O robô coloca mais dinheiro (até 1,5x) em quem está ganhando e menos (até 0,5x) em quem está perdendo.</div><div id="rank" class="text-sm muted">Sem operações fechadas ainda.</div></div>
  <div class="card"><div class="font-semibold mb-1">🤖 O que o robô está fazendo agora</div><div id="rstate" class="text-sm muted">Carregando…</div></div>
  <div class="card"><div class="flex justify-between items-center mb-1"><div class="font-semibold">Mercado agora</div><button class="text-xs" style="color:var(--acc)" onclick="go('market')">ver gráficos →</button></div><div id="wl" class="text-sm muted">Carregando cotações...</div></div>
  <div class="card"><div class="font-semibold mb-2">Sinais aguardando você</div><div id="pend"></div></div>
  ${S.trading_mode=="paper"?`<div class="card"><div class="font-semibold mb-1">Pronto para dinheiro real?</div><div id="ready" class="text-sm muted">Conferindo...</div></div>`:""}`;
  sigTable($("#pend"),await api("/api/signals?status=pending"));
  const [eq,stt,wl]=await Promise.all([api("/api/equity"),api("/api/stats"),api("/api/market/watchlist").catch(()=>[])]);
  const g=$("#eq").getContext("2d").createLinearGradient(0,0,0,150);g.addColorStop(0,"rgba(56,189,248,.35)");g.addColorStop(1,"rgba(56,189,248,0)");
  charts.push(new Chart($("#eq"),{type:"line",data:{labels:eq.map(e=>dt(e.ts)),datasets:[{data:eq.map(e=>e.equity),borderColor:"#38bdf8",borderWidth:2,pointRadius:0,fill:true,backgroundColor:g,tension:.3}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{ticks:{color:"#8b97ad",maxTicksLimit:4},grid:{color:"#1f2a3d"}}}}}));
  charts.push(new Chart($("#alloc"),{type:"doughnut",data:{labels:(S.by_market||[]).map(x=>x.label),datasets:[{data:(S.by_market||[]).map(x=>x.equity),backgroundColor:["#38bdf8","#a78bfa","#22c55e"],borderWidth:0}]},options:{cutout:"72%",plugins:{legend:{display:false}}}}));
  $("#st0").textContent=`${stt.trades} operações fechadas`;
  if(stt.ranking&&stt.ranking.length)$("#rank").innerHTML=(stt.by_market.length?`<div class="flex gap-2 flex-wrap mb-2">${stt.by_market.map((x,i)=>`<span class="chip" style="background:var(--panel2);color:var(--txt)">${i==0?"🥇 ":""}${MK[x.market]||x.market}: <span class="${cls(x.pnl)}">${fmt(x.pnl)}</span></span>`).join("")}</div>`:"")+
    stt.ranking.slice(0,10).map((r,i)=>`<div class="flex justify-between gap-2 py-1.5" style="border-top:1px solid var(--line)"><span style="color:var(--txt)">${i+1}. <b>${r.symbol}</b> <span class="text-xs muted">${MK[r.market]||""} · ${r.w}/${r.n} acertos</span></span><span class="num text-right"><span class="${cls(r.pnl)}">${fmt(r.pnl)}</span> <span class="chip" style="background:var(--panel2);color:${r.weight>1?"var(--up)":r.weight<1?"var(--down)":"var(--muted)"}">${r.weight.toFixed(2)}x</span></span></div>`).join("");
  $("#st1").innerHTML=[["Acerto",stt.trades?(stt.win_rate*100).toFixed(0)+"%":"-"],["Fator lucro",stt.profit_factor?fmt(stt.profit_factor):"-"],["Melhor",fmt(stt.best)]].map(([a,b])=>`<div class="rounded-xl py-2" style="background:var(--panel2)"><div class="text-xs muted">${a}</div><div class="font-semibold num">${b}</div></div>`).join("");
  charts.push(new Chart($("#pnls"),{type:"bar",data:{labels:stt.last_pnls.map((_,i)=>i+1),datasets:[{data:stt.last_pnls,backgroundColor:stt.last_pnls.map(v=>v>=0?"#22c55e":"#ef4444"),borderRadius:3}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}}));
  $("#wl").innerHTML=wl.length?watchRows(wl.slice(0,8)):"Aguardando o primeiro ciclo do robô.";
  api("/api/robot/state").then(rs=>{const IC={"comprado":"🟢","comprando":"⚡","bloqueado":"⛔","aguardando":"⏳","sem estratégia":"🧪"};
    const cnt={};rs.forEach(x=>cnt[x.status]=(cnt[x.status]||0)+1);
    $("#rstate").innerHTML=(rs.length?`<div class="flex gap-2 flex-wrap mb-2">${Object.entries(cnt).map(([k,v])=>`<span class="chip" style="background:var(--panel2);color:var(--txt)">${IC[k]||""} ${v} ${k}</span>`).join("")}</div>`:"")+
    (rs.map(x=>`<div class="flex justify-between gap-2 py-1.5" style="border-top:1px solid var(--line)"><span style="color:var(--txt)">${IC[x.status]||""} <b>${x.symbol}</b> <span class="text-xs muted">${MK[x.market]||""}${x.strategy?" · "+x.strategy:""}</span></span><span class="text-xs muted text-right">${x.detail}</span></div>`).join("")||"Aguardando o primeiro ciclo.")}).catch(()=>{});
  if(S.trading_mode=="paper")api("/api/readiness").then(r=>{$("#ready").innerHTML=`<div class="font-bold mb-2" style="color:${r.ready?"var(--up)":"var(--warn)"}">${r.ready?"✅ Sim":"⏳ Ainda não"}</div>`+r.items.map(i=>`<div class="flex justify-between gap-2 py-1.5" style="border-top:1px solid var(--line)"><span>${i.ok?"✅":"⏳"} ${i.label}</span><span class="text-xs muted text-right">${i.value}</span></div>`).join("")+`<div class="text-xs mt-2">${r.advice}</div>`}).catch(()=>{});
}
function watchRows(w){return w.map(r=>`<div class="flex items-center justify-between py-2 cursor-pointer gap-2" style="border-top:1px solid var(--line)" onclick="openChart('${r.market}','${r.symbol}')">
  <div class="min-w-0"><div class="font-semibold text-[15px] flex items-center gap-1.5" style="color:var(--txt)">${r.name}${r.position?`<span class="chip" style="background:rgba(34,197,94,.15);color:var(--up)">posição</span>`:""}</div>
  <div class="text-xs muted truncate">${r.index?"Índice":MK[r.market]||r.market}${r.strategy?" · "+r.strategy:""}</div></div>
  <div class="flex items-center gap-3 shrink-0">${spark(r.spark,70)}<div class="text-right num w-24"><div style="color:var(--txt)">${px(r.price)}</div><div class="text-xs ${cls(r.change_24h)}">${pct(r.change_24h)}</div></div></div></div>`).join("")}

/* ------------------------------- CARTEIRA ----------------------------- */
async function wallet(m){
  const P=await api("/api/portfolio");const W=P[wmode];
  const hasLive=P.live.markets.length||P.live.positions.length||P.live.trades.length;
  m.innerHTML=`<div class="seg"><button class="${wmode=="live"?"on":""}" onclick="wmode='live';render()">💵 Dinheiro real</button><button class="${wmode=="paper"?"on":""}" onclick="wmode='paper';render()">🧪 Fictício (simulação)</button></div>
  <div class="flex items-center gap-2 text-xs muted px-1"><span class="live-dot"></span> Atualizando a cada 10 segundos</div>
  ${wmode=="live"&&!hasLive?`<div class="card text-sm"><div class="font-semibold mb-1">Nenhum dinheiro real ainda</div><div class="muted">Quando você conectar a corretora com dinheiro real, cada investimento aparece aqui, separado da simulação. Siga a Fase 6 do guia, depois que o cartão "Pronto para dinheiro real?" ficar verde.</div></div>`:`
  <div class="grid grid-cols-2 gap-3">${kpi("Resultado em aberto",fmt(W.open_pnl),cls(W.open_pnl),W.positions.length+" posição(ões) agora")}${kpi("Lucro realizado",fmt(W.realized),cls(W.realized),W.closed+" operação(ões) fechada(s)")}</div>
  <div class="card"><div class="font-semibold mb-2">Saldo por mercado</div>${W.markets.map(x=>`<div class="flex justify-between py-1.5 text-sm" style="border-top:1px solid var(--line)"><span>${MK[x.market]||x.market} <span class="muted">(${x.currency})</span></span><span class="num"><b>${fmt(x.equity)}</b> <span class="text-xs muted">caixa ${fmt(x.cash)}</span></span></div>`).join("")||'<div class="text-sm muted">—</div>'}</div>
  <div class="font-semibold px-1 pt-1">Investimentos abertos</div>
  ${W.positions.map(p=>`<div class="card" onclick="openChart('${p.market}','${p.symbol}')"><div class="flex justify-between items-start gap-2">
     <div class="min-w-0"><div class="font-bold text-[15px]">${p.symbol} <span class="chip" style="background:var(--panel2)">${MK[p.market]||p.market}</span></div><div class="text-xs muted">comprado há ${ago(p.opened_ts)} · ${p.strategy||""}</div></div>
     <div class="text-right num shrink-0"><div class="text-lg font-bold ${cls(p.pnl)}">${p.pnl>=0?"+":""}${fmt(p.pnl)}</div><div class="text-xs ${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</div></div></div>
     <div class="grid grid-cols-3 gap-2 text-xs mt-3 num">${[["Investido",p.currency+" "+fmt(p.invested)],["Vale agora",p.currency+" "+fmt(p.value)],["Preço",px(p.price)]].map(([a,b])=>`<div><div class="muted">${a}</div><div style="color:var(--txt)">${b}</div></div>`).join("")}</div>
     ${p.stop?`<div class="mt-2 h-1.5 rounded-full overflow-hidden" style="background:var(--panel2)"><div style="width:${Math.max(3,Math.min(100,(p.price-p.stop)/((p.take||p.price*1.1)-p.stop)*100))}%;height:100%;background:linear-gradient(90deg,var(--down),var(--up))"></div></div><div class="flex justify-between text-[11px] muted mt-1 num"><span>stop ${px(p.stop)}</span><span>alvo ${p.take?px(p.take):"-"}</span></div>`:""}</div>`).join("")||'<div class="card text-sm muted">Nenhum investimento aberto agora. O robô compra quando a estratégia dá sinal.</div>'}
  <div class="card"><div class="font-semibold mb-2">Cada operação</div>${W.trades.map(t=>`<div class="flex justify-between items-center py-2 gap-2" style="border-top:1px solid var(--line)">
     <div class="min-w-0"><div class="text-sm"><span class="${t.side=="buy"?"up":"down"} font-semibold">${t.side=="buy"?"Comprou":"Vendeu"}</span> ${t.symbol} <span class="chip" style="background:var(--panel2)">${MK[t.market]||t.market}</span></div><div class="text-xs muted truncate">${dt(t.ts)} · ${fmt(t.qty,4)} × ${px(t.price)}</div></div>

function openChart(mk,sy){sel={market:mk,symbol:sy};if(tab!="market"){tab="market";killCharts();load().then(()=>market($("#main")))}else{killCharts();market($("#main"))}window.scrollTo(0,0)}
async function drawChart(mk,sy,row){
  let d;try{d=await api(`/api/market/candles?symbol=${encodeURIComponent(sy)}&market=${mk}`)}catch(e){$("#chart").innerHTML=`<div class="p-6 text-sm muted">${e.message}</div>`;return}
  $("#cTitle").textContent=row?row.name:sy;$("#cSub").textContent=(row&&row.index?"Índice":MK[mk]||mk)+(row&&row.strategy?" · estratégia "+row.strategy:"");
  if(row){$("#cPx").textContent=px(row.price);$("#cCh").innerHTML=`<span class="${cls(row.change_24h)}">${pct(row.change_24h)} 24h</span>`}
  const el=$("#chart");
  lwc=LightweightCharts.createChart(el,{width:el.clientWidth,height:340,layout:{background:{color:"#111827"},textColor:"#8b97ad",fontSize:11},grid:{vertLines:{color:"#1a2436"},horzLines:{color:"#1a2436"}},rightPriceScale:{borderColor:"#1f2a3d"},timeScale:{borderColor:"#1f2a3d",timeVisible:true},crosshair:{mode:0}});
  charts.push(lwc);
  const c=lwc.addCandlestickSeries({upColor:"#22c55e",downColor:"#ef4444",borderVisible:false,wickUpColor:"#22c55e",wickDownColor:"#ef4444"});
  c.setData(d.bars);
  lwc.addLineSeries({color:"#f59e0b",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false}).setData(d.ema.filter(x=>x.value));
  const times=d.bars.map(b=>b.time);
  const near=t=>{const s=Date.parse(t)/1000;let best=times[0];for(const x of times){if(x<=s)best=x;else break}return best};
  c.setMarkers(d.trades.filter(t=>Date.parse(t.ts)/1000>=times[0]).map(t=>({time:near(t.ts),position:t.side=="buy"?"belowBar":"aboveBar",color:t.side=="buy"?"#22c55e":"#ef4444",shape:t.side=="buy"?"arrowUp":"arrowDown",text:t.side=="buy"?"C":"V "+fmt(t.pnl)})).sort((a,b)=>a.time-b.time));
  if(d.position){if(d.position.stop)c.createPriceLine({price:d.position.stop,color:"#ef4444",lineStyle:2,title:"stop"});
    if(d.position.take)c.createPriceLine({price:d.position.take,color:"#22c55e",lineStyle:2,title:"alvo"});
    c.createPriceLine({price:d.position.avg_price,color:"#38bdf8",lineStyle:1,title:"entrada"})}
  lwc.timeScale().fitContent();
  window.onresize=()=>lwc&&lwc.applyOptions({width:el.clientWidth});
}

async function calc(m){const st=await api("/api/stats");
  const real=S.deposits&&st.trades?S.profit/S.deposits:null;
  m.innerHTML=`<div class="card space-y-3"><div class="font-semibold">🧮 Calculadora de juros compostos</div>
   <div class="text-xs muted">Simula o reinvestimento automático. O resultado real do robô até agora: <b style="color:var(--txt)">${real==null?"ainda sem operações suficientes":pct(real)+" no total, em "+st.trades+" operações"}</b>.</div>
   <div class="grid grid-cols-3 gap-2"><label class="text-xs muted">Capital (R$)<input id="k0" type="number" value="500"></label><label class="text-xs muted">% ao mês<input id="kr" type="number" value="3" step="0.5"></label><label class="text-xs muted">Meses<input id="km" type="number" value="12"></label></div>
   <label class="text-xs muted">Aporte mensal extra (R$)<input id="ka" type="number" value="0"></label>
   <div class="flex gap-2 flex-wrap">${[["Conservador",1],["Bom",3],["Excelente",5],["Raríssimo",10]].map(([a,b])=>`<button class="btn text-xs" style="background:var(--panel2)" onclick="$('#kr').value=${b};runCalc()">${a} ${b}%</button>`).join("")}</div>
   <div id="kout"></div><div style="height:200px"><canvas id="kc"></canvas></div>
   <div class="text-xs muted">Projeção matemática, não promessa. Meses negativos acontecem e a trava de segurança limita perdas.</div></div>`;
  ["k0","kr","km","ka"].forEach(i=>$("#"+i).oninput=runCalc);runCalc()}
function runCalc(){const k=+$("#k0").value,r=+$("#kr").value/100,n=Math.min(120,+$("#km").value),a=+$("#ka").value;
  let v=k,inv=k,ser=[k],bad=[k];let vb=k;for(let i=1;i<=n;i++){v=v*(1+r)+a;inv+=a;vb=vb*(1-r)+a;ser.push(v);bad.push(vb)}
  $("#kout").innerHTML=`<div class="grid grid-cols-3 gap-2 text-center">${[["Investido",fmt(inv)],["Final",fmt(v)],["Lucro",fmt(v-inv)]].map(([x,y],i)=>`<div class="rounded-xl py-2" style="background:var(--panel2)"><div class="text-xs muted">${x}</div><div class="font-bold num ${i==2?cls(v-inv):""}">R$ ${y}</div></div>`).join("")}</div>`;
  killCharts();charts.push(new Chart($("#kc"),{type:"line",data:{labels:ser.map((_,i)=>i),datasets:[{label:"se der certo",data:ser,borderColor:"#22c55e",pointRadius:0,borderWidth:2},{label:"se der errado (mesma %)",data:bad,borderColor:"#ef4444",pointRadius:0,borderWidth:1.5,borderDash:[4,4]}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:"#8b97ad",boxWidth:10}}},scales:{x:{ticks:{color:"#8b97ad"},grid:{display:false},title:{display:true,text:"meses",color:"#8b97ad"}},y:{ticks:{color:"#8b97ad"},grid:{color:"#1f2a3d"}}}}}))}

const FIELDS=[["execution_mode","Modo de execução","sel",["manual","auto"]],["auto_evolve","Ativar sozinho estratégias melhores","bool"],["reinvest_profits","Reinvestir lucros (juros compostos)","bool"],
 ["risk_per_trade","Risco por operação (0.01 = 1%)"],["max_position_pct","Máx. por ativo (0.25 = 25%)"],["max_positions","Máx. posições por mercado"],["max_daily_loss_pct","Perda diária máx. (para de comprar)"],
 ["max_drawdown_pct","Queda máx. desde o topo (trava total)"],["atr_stop_mult","Distância do stop (x ATR)"],["take_profit_r","Alvo (x risco)"],["trailing_stop","Stop móvel","bool"],["brain_enabled","🧠 Cérebro (conselho de agentes)","bool"],["simulate_with_live","Simular junto com o dinheiro real","bool"],["signal_ttl_minutes","Validade do sinal (min)"],["evolve_every_hours","Evoluir estratégias a cada (h)"],
 ["us_max_position_pct","EUA: máx. por ação (%)"],["us_cash_buffer_pct","EUA: reserva em caixa (%)"],["us_max_order_usd","EUA: ordem máx. (US$)"],["us_max_orders_per_day","EUA: ordens por dia"],["us_blocked","EUA: tickers bloqueados"],
 ["us_watch_news","EUA: vigiar notícias","bool"],["us_watch_pelosi","EUA: vigiar Congresso","bool"],["us_watch_alerts","EUA: vigiar alertas","bool"]];
async function settings(m){const st=S.settings;const pr=S.profile||"normal";
  m.innerHTML=`<div class="card space-y-3"><div class="font-semibold">Perfil de operação</div>
  <div class="grid grid-cols-2 gap-2">
   <button class="rounded-xl p-3 text-left ${pr=="normal"?"glow":""}" style="background:var(--panel2)" onclick="setProfile('normal')"><div class="font-semibold">🎯 Normal</div><div class="text-xs muted mt-1">Gráfico de 1h · 3 criptos · menos operações, mais seletivo</div></button>
   <button class="rounded-xl p-3 text-left ${pr=="metralhadora"?"glow":""}" style="background:var(--panel2)" onclick="setProfile('metralhadora')"><div class="font-semibold">⚡ Metralhadora</div><div class="text-xs muted mt-1">Gráfico de 15 min · 12 criptos + B3 · até 8 posições juntas · várias operações por dia</div></button>
   <button class="col-span-2 rounded-xl p-3 text-left ${pr=="turbo"?"glow":""}" style="background:var(--panel2)" onclick="setProfile('turbo')"><div class="font-semibold">🚀 Turbo</div><div class="text-xs muted mt-1">24 criptos + 20 ações da B3 · até 10 posições por mercado · risco de 2% por operação (ganha e perde o dobro)</div></button></div>
  <div class="text-xs muted">Agora: <b style="color:var(--txt)">${pr}</b> · gráfico ${S.timeframe} · ${S.n_symbols} ativos. Em qualquer perfil, o robô só usa estratégias que deram lucro já descontando as taxas.</div></div>
  <div class="card space-y-3"><div class="font-semibold">Ajustes</div>
  <div class="text-xs rounded-xl p-3" style="background:rgba(245,158,11,.1);color:#fcd34d">No <b>modo automático</b> o robô compra e vende sozinho, dentro dos limites abaixo. Stops de proteção são executados na hora em qualquer modo.</div>
  <div class="grid md:grid-cols-2 gap-3">${FIELDS.map(([k,l,t,o])=>`<label class="text-sm"><span class="muted text-xs">${l}</span>${t=="sel"?`<select data-k="${k}">${o.map(x=>`<option ${st[k]==x?"selected":""} value="${x}">${x=="auto"?"automático":"manual (eu aprovo)"}</option>`).join("")}</select>`:t=="bool"?`<select data-k="${k}"><option value="true" ${st[k]=="true"?"selected":""}>sim</option><option value="false" ${st[k]!="true"?"selected":""}>não</option></select>`:`<input data-k="${k}" value="${st[k]??""}">`}</label>`).join("")}</div>
  <div class="flex gap-2 flex-wrap"><button class="btn text-slate-900" style="background:var(--acc)" onclick="saveSettings()">Salvar</button><button class="btn" style="background:var(--panel2)" onclick="changePw()">Trocar minha senha</button>
  ${st.kill_switch=="true"?`<button class="btn text-white" style="background:var(--up)" onclick="unlock()">Destravar trava</button>`:""}</div></div>`}
async function saveSettings(){const v={};document.querySelectorAll("[data-k]").forEach(e=>v[e.dataset.k]=e.value);
  let confirm="";if(v.execution_mode=="auto"&&S.settings.execution_mode!="auto"){confirm=prompt("O robô vai operar SOZINHO. Digite CONFIRMO:")||"";if(confirm.toUpperCase()!="CONFIRMO")return}
  try{await post("/api/settings",{values:v,confirm});toast("Salvo")}catch(e){toast(e.message)}render()}
async function setProfile(n){if(!confirm(n=="metralhadora"?"Ativar o modo Metralhadora? O robô vai reaprender as estratégias no gráfico de 15 min com 12 criptos.":n=="turbo"?"Ativar o Turbo? 24 criptos + 20 ações da B3 e risco de 2% por operação: ganha e perde o dobro por operação.":"Voltar ao perfil Normal?"))return;try{toast((await post("/api/profile",{name:n})).message)}catch(e){toast(e.message)}render()}
async function unlock(){const c=prompt("Digite CONFIRMO para destravar:");try{await post("/api/settings",{values:{kill_switch:"false"},confirm:c||""});toast("Destravado")}catch(e){toast(e.message)}render()}
async function togglePause(){await post("/api/settings",{values:{paused:S.settings.paused=="true"?"false":"true"}});render()}
async function panic(){if(!confirm("Ligar a trava de segurança? O robô para de abrir posições (stops continuam ativos)."))return;await post("/api/settings",{values:{kill_switch:"true"}});render()}
async function logout(){await post("/api/logout");location.href="/login"}
async function changePw(){const o=prompt("Senha atual:");if(!o)return;const n=prompt("Nova senha (mín. 10 caracteres):");if(!n)return;try{await post("/api/password",{old:o,new:n});toast("Senha alterada")}catch(e){toast(e.message)}}

async function logs(m){const l=await api("/api/logs");m.innerHTML=`<div class="card text-xs font-mono">${l.map(x=>`<div class="py-1" style="border-top:1px solid var(--line);color:${x.level=="ERROR"?"var(--down)":x.level=="WARN"?"var(--warn)":"var(--txt)"}"><span class="muted">${dt(x.ts)}</span> ${x.msg}</div>`).join("")}</div>`}

render();
setInterval(()=>{if(tab=="wallet")wallet($("#main")).catch(()=>{})},10000);
setInterval(()=>{if(tab=="home"||tab=="signals")render();else if(tab!="wallet"&&tab!="market")load()},30000);
</script>
</body>
</html>

# Produção (VPS Hostinger): robô + Caddy com HTTPS automático (Let's Encrypt)
services:
  robo:
    build: .
    env_file: .env
    environment:
      - TRUST_PROXY=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - robo

volumes:
  caddy_data:
  caddy_config:
